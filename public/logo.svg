<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Warm cream background matching user logo -->
  <rect width="500" height="500" rx="40" fill="#F4EFEA"/>
  
  <g fill="#9A1C24">
    <!-- Nutri cursive/bubbly text -->
    <text x="250" y="180" 
          text-anchor="middle" 
          font-family="'Fredoka', 'Lilita One', 'Arial Rounded MT Bold', 'Impact', sans-serif" 
          font-weight="900" 
          font-size="62" 
          letter-spacing="-1">
      Nutri
    </text>
    
    <!-- NEWS arched chunky bubble font -->
    <text x="250" y="315" 
          text-anchor="middle" 
          font-family="'Fredoka', 'Lilita One', 'Impact', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="140" 
          letter-spacing="2"
          transform="scale(1, 0.95)">
      NEWS
    </text>
    
    <!-- Slogan CUIDE-SE E VIVA FELIZ! -->
    <text x="250" y="375" 
          text-anchor="middle" 
          font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" 
          font-weight="800" 
          font-size="19" 
          letter-spacing="2.5">
      CUIDE-SE E VIVA FELIZ!
    </text>
  </g>
</svg>
